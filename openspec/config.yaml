schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  CloudTube is a Vite + React + TypeScript app deployed as a Cloudflare Worker.
  Every merge to `main` auto-deploys to production, so each PR is a release.
  Verify with `npx tsc --noEmit`, `npm test` and `npx vite build`; browser proof
  uses Playwright (`npm run e2e`).
  Docs/config/tooling-only changes set `skip_specs: true`.

