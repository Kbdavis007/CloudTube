<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cf_orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6821F"/>
      <stop offset="100%" stop-color="#FA541C"/>
    </linearGradient>
    <linearGradient id="yt_red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="100%" stop-color="#CC0000"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F6821F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background with rounded corners for maskable safe area -->
  <rect width="512" height="512" rx="100" fill="#0b0f19"/>
  <circle cx="256" cy="256" r="220" fill="url(#glow)"/>
  
  <!-- Cloudflare Cloud Silhouette behind -->
  <path d="M374 270c-2-36-32-65-69-65-17 0-33 6-45 18-12-24-37-41-66-41-41 0-75 33-75 74 0 4 .3 9 1 13-33 5-59 33-59 68 0 38 31 69 69 69h240c35 0 63-28 63-63 0-33-25-60-58-63z" 
        fill="#1e293b" opacity="0.6"/>

  <!-- Cloudflare Accent Arc -->
  <path d="M170 330h172c20 0 36-16 36-36 0-18-14-34-32-36-2-28-25-50-54-50-13 0-25 5-34 13-9-19-28-31-50-31-31 0-56 25-56 56 0 3 .2 7 .7 10-24 4-43 25-43 51 0 28 23 51 51 51"
        fill="url(#cf_orange)" opacity="0.95"/>

  <!-- YouTube Play Plaque overlapping -->
  <rect x="180" y="210" width="180" height="126" rx="30" fill="url(#yt_red)" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.5))"/>
  
  <!-- YouTube White Triangle -->
  <polygon points="252,246 252,300 298,273" fill="#ffffff"/>
  
  <!-- Badge free-tier badge ring -->
  <circle cx="360" cy="180" r="18" fill="#10B981" stroke="#0b0f19" stroke-width="4"/>
  <path d="M354 180l4 4 8-8" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
