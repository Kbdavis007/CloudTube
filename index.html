<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- YouTube's embed player needs a Referer to configure itself; with no
         referrer at all it fails with "Error 153: Video player configuration
         error". strict-origin-when-cross-origin sends only this site's origin
         cross-origin, which is what the player expects. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>CloudTube — Your Personal YouTube Library</title>
    <meta name="app-version" content="%APP_VERSION%" />
    <meta name="app-commit" content="%APP_COMMIT%" />
    <meta name="description" content="Collect the YouTube videos you care about, save notes, and get smart summaries — all in one private library that works offline." />
    <meta name="theme-color" content="#f97316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CloudTube" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta property="og:title" content="CloudTube — Your Personal YouTube Library" />
    <meta property="og:description" content="Collect the YouTube videos you care about, save notes, and get smart summaries — all in one private library that works offline." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Apply the saved theme before first paint so a light/medium choice does
      // not flash the dark default. Keep the storage key in sync with theme.ts.
      (function () {
        try {
          var mode = localStorage.getItem('cloudtube.theme');
          if (mode === 'light' || mode === 'medium' || mode === 'dark') {
            document.documentElement.setAttribute('data-theme', mode);
            document.documentElement.style.colorScheme = mode === 'light' ? 'light' : 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta && mode === 'light') meta.setAttribute('content', '#FFFFFF');
          }
        } catch (e) {
          /* localStorage unavailable: fall back to the dark default. */
        }
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-orange-500/30 selection:text-orange-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
