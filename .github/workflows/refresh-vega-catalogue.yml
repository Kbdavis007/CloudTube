name: Refresh Vega catalogue

# Scrapes the Vega search pages once a day, rebuilds the baked catalogue, and
# lands it as a tagged release. The release push is what makes Cloudflare
# rebuild and redeploy the app, so the site picks up the fresh catalogue.
#
# Every push to main must be a release (see AGENTS.md), so this runs the same
# `scripts/release.mjs patch` flow a human would rather than pushing a bare data
# commit.
#
# Scraping needs no secret: scrape.sh fetches with curl first, and only falls
# back to the Firecrawl CLI (which needs FIRECRAWL_API_KEY) if curl stops
# returning results. Add FIRECRAWL_API_KEY under Settings -> Secrets and
# variables -> Actions to arm that fallback; without it the curl path still runs.
#
# Cloudflare Workers Builds rebuild on a push only when "Builds" is enabled for
# the project. If it is not, set a deploy hook URL as the CF_DEPLOY_HOOK secret
# (Workers & Pages -> the project -> Settings -> Builds -> Deploy hooks) and the
# workflow will trigger the rebuild itself.

on:
  schedule:
    # 06:17 UTC daily. A few minutes past the hour avoids the top-of-hour rush
    # on GitHub's scheduler.
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-vega-catalogue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release.mjs resolves the next version and writes the changelog from
          # `git describe` and the tag list, so it needs the full history and
          # every tag. Without fetch-tags it would pick a version a concurrent
          # session already tagged, and the tag push would be rejected.
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the HTML parser
        run: python3 -m pip install --quiet beautifulsoup4

      # Only used when curl cannot reach the listing. Best effort: a failure
      # here must not stop the curl path from running.
      - name: Install the Firecrawl CLI (fallback)
        continue-on-error: true
        run: npm install -g firecrawl-cli

      - name: Scrape the search pages
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          # "source:outdir:urlsfile" per wired source. A source that fails to
          # fetch is skipped (its videos stay in the catalogue, carried
          # forward), so one flaky site cannot block the whole daily refresh.
          sources=(
            "vega:vega_pages:vega_urls.txt"
            "xgroovy:xgroovy_pages:xgroovy_urls.txt"
            "justporn:justporn_pages:justporn_urls.txt"
            "hornyfap:hornyfap_pages:hornyfap_urls.txt"
            "yesporn:yesporn_pages:yesporn_urls.txt"
            "xxbrits:xxbrits_pages:xxbrits_urls.txt"
            "notfans:notfans_pages:notfans_urls.txt"
            "pornlib:pornlib_pages:pornlib_urls.txt"
            "drtuber:drtuber_pages:drtuber_urls.txt"
            "porngo:porngo_pages:porngo_urls.txt"
            "youjizz:youjizz_pages:youjizz_urls.txt"
            "anysex:anysex_pages:anysex_urls.txt"
            "alotporn:alotporn_pages:alotporn_urls.txt"
          )
          for entry in "${sources[@]}"; do
            IFS=: read -r src outdir urls <<<"$entry"
            echo "::group::scrape $src"
            bash scrapers/vega/scrape.sh "scrapers/vega/data/$outdir" "scrapers/vega/$urls" \
              || echo "::warning::scrape failed for $src; its catalogue entries are carried forward"
            echo "::endgroup::"
          done

      - name: Resolve exact upload dates
        # Listings mostly carry no date, so read `uploadDate` from each video's
        # own page. Ids already dated in the committed catalogue are skipped, so
        # a daily run only fetches the handful that are new. drtuber and porngo
        # expose no date anywhere, so they are left out (their entries fall back
        # to the day they were first catalogued).
        run: |
          for src in justporn hornyfap yesporn xxbrits notfans pornlib youjizz anysex alotporn; do
            pages=(scrapers/vega/data/${src}_pages/p*.html)
            [ -e "${pages[0]}" ] || { echo "no pages for $src; skipping dates"; continue; }
            python3 scrapers/vega/engine_dates.py --source "$src" \
              --out "scrapers/vega/data/${src}_dates.json" \
              --known scrapers/vega/data/vega_catalog.jsonc \
              "${pages[@]}" || echo "::warning::date resolution failed for $src"
          done
          python3 scrapers/vega/xg_dates.py \
            --out scrapers/vega/data/xgroovy_dates.json \
            --known scrapers/vega/data/vega_catalog.jsonc \
            scrapers/vega/data/xgroovy_pages/p*.html

      - name: Rebuild the baked catalogue
        run: |
          python3 scrapers/vega/vega_build_manifest.py scrapers/vega/data/vega_catalog.jsonc \
            --source vega scrapers/vega/data/vega_pages/p*.html
          python3 scrapers/vega/vega_build_manifest.py scrapers/vega/data/vega_catalog.jsonc \
            --source xgroovy --dates scrapers/vega/data/xgroovy_dates.json \
            scrapers/vega/data/xgroovy_pages/p*.html
          for src in justporn hornyfap yesporn xxbrits notfans pornlib drtuber porngo youjizz anysex alotporn; do
            pages=(scrapers/vega/data/${src}_pages/p*.html)
            [ -e "${pages[0]}" ] || { echo "no pages for $src; skipping build"; continue; }
            dates="scrapers/vega/data/${src}_dates.json"
            date_args=()
            [ -f "$dates" ] && date_args=(--dates "$dates")
            python3 scrapers/vega/vega_build_manifest.py scrapers/vega/data/vega_catalog.jsonc \
              --source "$src" "${date_args[@]}" "${pages[@]}"
          done

      - name: Bake the catalogue into the app
        run: |
          python3 - <<'PY'
          import json, shutil
          catalog = json.load(open('scrapers/vega/data/vega_catalog.json'))
          videos = catalog.get('videos') or []
          if not videos:
              raise SystemExit('catalogue is empty; refusing to replace the baked file')
          # The app imports this path directly, so it must be present and valid.
          shutil.copyfile('scrapers/vega/data/vega_catalog.json', 'src/data/vegaCatalog.json')
          print(f'baked {len(videos)} videos')
          PY

      - name: Commit the refreshed catalogue
        id: data
        run: |
          git config user.name  'cloudtube-bot'
          git config user.email 'cloudtube-bot@users.noreply.github.com'
          git add scrapers/vega/data src/data/vegaCatalog.json
          if git diff --cached --quiet; then
            echo "Catalogue unchanged; nothing to release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(vega): refresh the baked catalogue"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cut the release
        id: release
        if: steps.data.outputs.changed == 'true'
        run: |
          for attempt in 1 2 3; do
            # Pick up anything that landed while we scraped, tags included, so
            # release.mjs does not pick a version a concurrent session took.
            git fetch --tags --force origin
            git pull --rebase origin main
            if ! node scripts/release.mjs patch; then
              echo "release attempt $attempt could not pick a free version; retrying" >&2
              sleep 15
              continue
            fi
            version="$(git describe --tags --abbrev=0)"
            # Push the commit and the tag together. If the tag is already taken
            # the push fails as a whole, so main never keeps a release commit
            # whose tag is missing.
            if git push --atomic origin main "$version"; then
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "release attempt $attempt collided on $version; retrying" >&2
            git tag -d "$version" || true
            git reset --hard HEAD~1
            sleep 15
          done
          echo "release failed after 3 attempts" >&2
          exit 1

      - name: Trigger a Cloudflare rebuild
        if: steps.data.outputs.changed == 'true'
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -n "${CF_DEPLOY_HOOK:-}" ]; then
            curl -fsS -X POST "$CF_DEPLOY_HOOK" >/dev/null
            echo "triggered the Cloudflare deploy hook"
          else
            echo "no CF_DEPLOY_HOOK secret; relying on Cloudflare's git integration"
          fi

      - name: Record the deploy
        if: steps.data.outputs.changed == 'true'
        continue-on-error: true
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # Best effort: wait briefly for the new version to serve, then stamp
          # the changelog entry. A failure here does not fail the run.
          for _ in $(seq 1 6); do
            serving=$(curl -fsS --max-time 15 https://ct.devmatrix.top/api/health \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('version',''))" 2>/dev/null || true)
            [ "$serving" = "${VERSION#v}" ] && break
            sleep 20
          done
          npm run deploy:log -- --env production --url https://ct.devmatrix.top \
            --notes "daily Vega catalogue refresh"
          git config user.name  'cloudtube-bot'
          git config user.email 'cloudtube-bot@users.noreply.github.com'
          git add CHANGELOG.md docs/DEPLOYMENTS.md
          git commit -m "chore(deploy): record $VERSION ship"
          git pull --rebase origin main
          git push
