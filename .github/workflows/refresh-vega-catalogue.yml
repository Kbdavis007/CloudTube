name: Refresh Vega catalogue

# Scrapes the Vega search pages once a day, rebuilds the baked catalogue, and
# commits it. Pushing to main makes Cloudflare rebuild and redeploy the app, so
# the site picks up the fresh catalogue.
#
# Needs one repository secret: FIRECRAWL_API_KEY (Settings -> Secrets and
# variables -> Actions). Without it the run skips the scrape and says so in the
# log rather than failing.
#
# Cloudflare Workers Builds rebuild on a push only when "Builds" is enabled for
# the project. If it is not, set a deploy hook URL as the CF_DEPLOY_HOOK secret
# (Workers & Pages -> the project -> Settings -> Builds -> Deploy hooks) and the
# final step will trigger the rebuild itself.

on:
  schedule:
    # 06:17 UTC daily. A few minutes past the hour avoids the top-of-hour rush
    # on GitHub's scheduler.
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-vega-catalogue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firecrawl CLI
        run: npm install -g firecrawl-cli

      - name: Check for the Firecrawl key
        id: key
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          if [ -n "${FIRECRAWL_API_KEY:-}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FIRECRAWL_API_KEY is not set, so there is nothing to scrape. Add it under Settings -> Secrets and variables -> Actions."
          fi

      - name: Scrape the search pages
        if: steps.key.outputs.has_key == 'true'
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: bash scrapers/vega/scrape.sh

      - name: Rebuild the baked catalogue
        if: steps.key.outputs.has_key == 'true'
        run: python3 scrapers/vega/vega_build_manifest.py scrapers/vega/data/vega_catalog.jsonc scrapers/vega/data/vega_pages/p*.json

      - name: Validate and bake the catalogue into the app
        if: steps.key.outputs.has_key == 'true'
        run: |
          python3 - <<'PY'
          import json, shutil
          catalog = json.load(open('scrapers/vega/data/vega_catalog.json'))
          videos = catalog.get('videos') or []
          if not videos:
              raise SystemExit('catalogue is empty; refusing to replace the baked file')
          # The app imports this path directly, so it must be present and valid.
          shutil.copyfile('scrapers/vega/data/vega_catalog.json', 'src/data/vegaCatalog.json')
          print(f'baked {len(videos)} videos')
          PY

      - name: Commit if the catalogue changed
        id: commit
        run: |
          git config user.name  'cloudtube-bot'
          git config user.email 'cloudtube-bot@users.noreply.github.com'
          git add scrapers/vega/data src/data/vegaCatalog.json
          if git diff --cached --quiet; then
            echo "No catalogue change; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # No "[skip ci]": the push is what makes Cloudflare rebuild and
            # redeploy, and that marker would suppress the build.
            git commit -m "chore(vega): refresh the baked catalogue"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        if: steps.commit.outputs.changed == 'true'
        run: git push

      - name: Trigger a Cloudflare rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -n "${CF_DEPLOY_HOOK:-}" ]; then
            curl -fsS -X POST "$CF_DEPLOY_HOOK" >/dev/null
            echo "triggered the Cloudflare deploy hook"
          else
            echo "no CF_DEPLOY_HOOK secret; relying on Cloudflare's git integration"
          fi
